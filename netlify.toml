# Ilumina Coruripe — deploy único para os dois apps
#   /          → app do cidadão (reporte de poste)
#   /tecnico/  → painel da equipe técnica / gestor / almoxarifado

[build]
  publish = "public"
  command = ""

# /tecnico sem barra final → /tecnico/
[[redirects]]
  from = "/tecnico"
  to = "/tecnico/"
  status = 301

# Atalho curto para QR impresso: /p/P-0001 → /?poste=P-0001
[[redirects]]
  from = "/p/:id"
  to = "/?poste=:id"
  status = 302

# Service workers e config nunca ficam presos em cache de CDN:
# é por aqui que sai uma correção de endpoint sem esperar expirar cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/tecnico/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/shared/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
