# Ilumina Coruripe — deploy único para os dois apps
#   /          → app do cidadão (reporte de poste)
#   /tecnico/  → painel da equipe técnica / gestor / almoxarifado
#   /api/*     → proxy para o servidor Node.js (evita CORS mantendo a mesma origem)

[build]
  publish = "public"
  command = "node scripts/build-config.mjs"

# /tecnico sem barra final → /tecnico/
[[redirects]]
  from = "/tecnico"
  to = "/tecnico/"
  status = 301

# Plaquetas antigas ja instaladas: /p/P-0001 → /?poste=P-0001 (o app ignora o parametro e abre o formulario)
[[redirects]]
  from = "/p/:id"
  to = "/?poste=:id"
  status = 302

# Proxy reverso da API REST para o servidor Node.js em Camadas (mesma origem, sem CORS)
# Em produção, substitua https://api-ilumina-coruripe.onrender.com pela URL real do Node.js
[[redirects]]
  from = "/api/*"
  to = "https://api-ilumina-coruripe.onrender.com/api/:splat"
  status = 200

# Service workers e config nunca ficam presos em cache de CDN:
# é por aqui que sai uma correção de endpoint sem esperar expirar cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/tecnico/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/shared/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/shared/infrastructure/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
