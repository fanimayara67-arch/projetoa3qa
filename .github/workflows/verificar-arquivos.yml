# Confere os arquivos de documentação (.md e .txt) alterados em cada PR para o main.
# Barra arquivo corrompido ou inchado, como o teste-pin/README.md do PR #14 (5 KB -> 1,5 MB),
# que a suíte de testes não pega porque não lê documentação.
# O resultado aparece no PR como um check (✅ passou / ❌ falhou).
name: Verificar arquivos

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentacao:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # precisa do histórico para comparar com o main

      - name: Instalar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verificar tamanho dos arquivos .md e .txt
        run: node scripts/ci/verificar-arquivos-pr.mjs "origin/${{ github.base_ref }}" HEAD
